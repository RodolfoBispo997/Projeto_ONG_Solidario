services:
  postgres:
    image: postgres:16
    container_name: projeto_ong_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projeto_ong
      POSTGRES_PASSWORD: projeto_ong_local
      POSTGRES_DB: projeto_ong
    ports:
      - "5433:5432"
    volumes:
      - projeto_ong_postgres_data:/var/lib/postgresql/data

volumes:
  projeto_ong_postgres_data:
